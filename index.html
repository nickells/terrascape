<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Terrascape 2.0</title>
<style>
  html,body{margin:0;height:100%;background:#008080;font:11px Verdana,"MS Sans Serif",Geneva,sans-serif;}
  *{-webkit-font-smoothing:none;-moz-osx-font-smoothing:auto;font-smooth:never;text-rendering:optimizeSpeed;}
  body{display:flex;align-items:center;justify-content:center;}
  .win{background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;box-shadow:inset -1px -1px #808080,inset 1px 1px #dfdfdf;padding:3px;position:relative;}
  .title{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:bold;padding:3px 4px;display:flex;justify-content:space-between;align-items:center;}
  .title .tb b{display:inline-block;width:14px;height:12px;background:#c0c0c0;color:#000;border:1px solid;border-color:#fff #000 #000 #fff;text-align:center;line-height:11px;font-size:9px;margin-left:2px;}
  .menubar{display:flex;padding:2px 0;position:relative;user-select:none;}
  .menubar>div{padding:2px 7px;cursor:default;}
  .menubar>div.open{background:#000080;color:#fff;}
  .dropdown{position:absolute;z-index:20;background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;box-shadow:inset -1px -1px #808080,2px 2px 0 rgba(0,0,0,.3);padding:2px;min-width:190px;}
  .dropdown .item{display:flex;justify-content:space-between;gap:18px;padding:3px 8px 3px 20px;position:relative;white-space:nowrap;cursor:default;}
  .dropdown .item:hover{background:#000080;color:#fff;}
  .dropdown .item.checked::before{content:"✓";position:absolute;left:6px;}
  .dropdown .item .k{opacity:.75;}
  .dropdown .sep{border-top:1px solid #808080;border-bottom:1px solid #fff;margin:3px 2px;}
  .main{display:flex;gap:4px;align-items:flex-start;}
  .side{display:flex;flex-direction:column;gap:4px;width:172px;height:604px;}
  #inspector{flex:1 1 auto;min-height:0;overflow-y:auto;}
  button,select,input{font:inherit;}
  button{background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;box-shadow:inset -1px -1px #808080;padding:3px 4px;cursor:pointer;}
  button:active{border-color:#000 #fff #fff #000;box-shadow:inset 1px 1px #808080;}
  button.big{text-align:left;padding:4px 6px;}
  fieldset{border:1px solid #808080;box-shadow:1px 1px #fff;padding:4px;margin:0;}
  legend{padding:0 2px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:3px;}
  .grid2 button{padding:3px 2px;}
  select,input[type=text],input[type=number]{background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;padding:1px 2px;box-sizing:border-box;min-width:0;}
  select{width:100%;}
  input[type=color]{width:100%;height:20px;padding:0;border:2px solid;border-color:#808080 #fff #fff #808080;background:#c0c0c0;}
  .row{display:grid;grid-template-columns:48px 1fr;align-items:center;gap:3px;margin:3px 0;}
  .xyz{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;}
  .xyz input{width:100%;}
  .hint{color:#404040;line-height:1.35;padding:2px;}
  .modes{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;margin:1px 0 4px;} .modes button{padding:2px 1px;}
  .modes button.on{border-color:#000 #fff #fff #000;box-shadow:inset 1px 1px #808080;background:#d8d8d8;font-weight:bold;}
  .slider.off{color:#808080;}
  .slider{display:grid;grid-template-columns:58px 1fr 34px;align-items:center;gap:2px;margin:1px 0;}
  .slider>div{display:contents;}
  .slider>div>span:first-child{grid-column:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .slider>input{grid-column:2;grid-row:1;width:100%;margin:0;height:16px;}
  .slider>div>span:last-child{grid-column:3;grid-row:1;text-align:right;}
  .tabs{display:flex;gap:0;margin:2px 0 -2px;position:relative;z-index:1;}
  .tabs button{flex:1;border-bottom:none;padding:2px 0;box-shadow:none;margin-right:-2px;background:#c0c0c0;}
  .tabs button.on{padding-bottom:4px;margin-top:-2px;}
  .ctabs .tabpage{box-sizing:border-box;margin-bottom:0;}   /* Create sizes to its buttons; Objects copies that height */
  .listbox{height:100%;overflow-y:auto;background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;box-sizing:border-box;}
  .li{display:flex;align-items:center;gap:4px;padding:1px 3px;white-space:nowrap;cursor:default;}
  .li .g{width:12px;text-align:center;flex:none;} .li .nm{overflow:hidden;text-overflow:ellipsis;flex:1;} .li .x{color:#808080;font-size:10px;}
  .li.sel{background:#000080;color:#fff;} .li.sel .x{color:#c0c0ff;} .li.hid .nm,.li.hid .g{color:#a0a0a0;} .li.sel.hid .nm{color:#b0b0d0;}
  .li .eye{flex:none;width:14px;text-align:center;cursor:pointer;} .li .eye:hover{outline:1px dotted currentColor;}
  .li.land{border-bottom:1px dotted #c0c0c0;}
  .tabpage{border:2px solid;border-color:#fff #000 #000 #fff;box-shadow:inset -1px -1px #808080;padding:4px;margin-bottom:4px;}
  .dialog.wiz{left:8px;top:64px;transform:none;width:300px;max-width:none;}
  .wiz .choices{display:grid;gap:3px;margin:3px 0 6px;} .wiz .c2{grid-template-columns:1fr 1fr;} .wiz .c3{grid-template-columns:1fr 1fr 1fr;}
  .wiz .choice{padding:4px 3px;} .wiz .choice.on{border-color:#000 #fff #fff #000;box-shadow:inset 1px 1px #808080;background:#d8d8d8;font-weight:bold;}
  .wiz .wbtns{display:flex;justify-content:space-between;padding:0 10px 10px;} .wiz .wbtns button{min-width:64px;margin-left:4px;}
  .dialog.ph{max-width:none;width:600px;top:48%;}
  .phbar{display:grid;grid-template-columns:1fr 170px;gap:4px;padding:6px 6px 4px;}
  .phbar input{width:100%;}
  .phgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:4px 6px;height:380px;overflow-y:auto;background:#fff;margin:0 6px;border:2px solid;border-color:#808080 #fff #fff #808080;align-content:start;}
  .tile{display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px;min-width:0;}
  .tile img{width:84px;height:84px;object-fit:contain;background:#dcdcdc;}
  .tile .nm{width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;}
  .tile .pc{color:#555;font-size:10px;} .tile .pc.heavy{color:#a02020;}
  .tile.busy{opacity:.5;cursor:wait;}
  .phfoot{display:flex;justify-content:space-between;padding:4px 8px 6px;color:#404040;}
  .well{border:2px solid;border-color:#808080 #fff #fff #808080;background:#000;line-height:0;}
  canvas{width:800px;height:600px;image-rendering:pixelated;display:block;outline:none;}
  .status{display:flex;gap:3px;margin-top:3px;}
  .status div{border:1px solid;border-color:#808080 #fff #fff #808080;padding:2px 4px;}
  .status #msg{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
  .status #modeLbl{flex:0 0 70px;} .status #pct{flex:0 0 96px;padding:0;}
  #resSel{border:0;background:transparent;width:100%;padding:1px 2px;cursor:pointer;}
  .dialog{position:absolute;z-index:30;left:50%;top:40%;transform:translate(-50%,-50%);background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;box-shadow:inset -1px -1px #808080,3px 3px 0 rgba(0,0,0,.35);min-width:320px;max-width:420px;}
  .dialog .body{padding:10px 12px;line-height:1.5;}
  .dialog .body table{border-collapse:collapse;} .dialog .body td{padding:1px 10px 1px 0;vertical-align:top;}
  .dialog .ok{display:flex;justify-content:center;padding:0 0 10px;} .dialog .ok button{min-width:70px;}
</style>
</head>
<body>
<div class="win" id="win">
  <div class="title"><span>Terrascape 2.0 - [<span id="docname">untitled.tsc</span>]</span><span class="tb"><b>_</b><b>□</b><b>×</b></span></div>
  <div class="menubar" id="menubar"></div>
  <div class="main">
    <div class="side">
      <div class="grid2" id="renderBtns">
        <button class="big" id="btnRender">▶ Render</button>
        <button class="big" id="btnRay">✦ Ray Trace</button>
      </div>
      <button class="big" id="btnEdit" style="display:none">◀ Back to Edit</button>
      <div class="ctabs">
        <div class="tabs"><button data-ctab="create" class="on">Create</button><button data-ctab="list">Objects</button></div>
        <div class="tabpage" id="createPage">
          <div class="grid2" id="createBtns"></div>
          <button id="btnPH" style="width:100%;margin-top:3px">🌐 Browse Poly Haven…</button>
        </div>
        <div class="tabpage" id="listPage" style="display:none"><div class="listbox" id="objList"></div></div>
      </div>
      <fieldset id="inspector"></fieldset>
    </div>
    <div class="well"><canvas id="view" tabindex="0"></canvas></div>
  </div>
  <div class="status"><div id="msg">Loading...</div><div id="modeLbl">Edit</div><div id="pct"><select id="resSel" title="Render resolution">
    <option value="400">400 x 300</option><option value="640">640 x 480</option><option value="800">800 x 600</option><option value="full">Full</option></select></div></div>
</div>
<input type="file" id="openFile" accept=".json,.tsc" hidden>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/",
  "three-mesh-bvh": "https://unpkg.com/three-mesh-bvh@0.9.18/src/index.js"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { computeBoundsTree, disposeBoundsTree, acceleratedRaycast } from 'three-mesh-bvh';
import { createTracer, KIND, MOON_GLSL, MOON_R } from './tracer.js';
import { startPixelEmoji } from './emoji.js';

// fast click-picking on the big Poly Haven meshes
THREE.BufferGeometry.prototype.computeBoundsTree = computeBoundsTree;
THREE.BufferGeometry.prototype.disposeBoundsTree = disposeBoundsTree;
THREE.Mesh.prototype.raycast = acceleratedRaycast;


let W = 400, H = 300, SS = 3;   // output size and supersampling factor (SS x SS samples per pixel)
const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.autoClear = false;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const rt = new THREE.WebGLRenderTarget(W * SS, H * SS, {
  type: THREE.HalfFloatType, minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
});

// ---------- ground fog: exp2 distance fog plus a layer that thickens toward y=0 ----------
THREE.ShaderChunk.fog_pars_vertex += `\n#ifdef USE_FOG\n varying float vFogY;\n#endif\n`;
THREE.ShaderChunk.fog_vertex += `\n#ifdef USE_FOG\n vFogY = (modelMatrix * vec4(position, 1.0)).y;\n#endif\n`;
THREE.ShaderChunk.fog_pars_fragment += `\n#ifdef USE_FOG\n varying float vFogY;\n#endif\n`;
THREE.ShaderChunk.fog_fragment = THREE.ShaderChunk.fog_fragment.replace(
  'gl_FragColor.rgb = mix(',
  `#ifdef FOG_EXP2
     fogFactor = max(fogFactor, 1.0 - exp(-vFogDepth * fogDensity * 1.1 * exp(-max(vFogY, 0.0) / 18.0)));
   #endif
   gl_FragColor.rgb = mix(`);

// ---------- Bryce-style procedural materials ----------
// solid 3D noise evaluated per pixel: colour speckle, fine grain, altitude strata and sub-pixel bump.
// Supersampling then averages the shimmer into that "smooth but noisy" look.
const NOISE_FUNCS = `
  float bh(vec3 p){ p = fract(p * .1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
  float bn(vec3 p){ vec3 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
    return mix(mix(mix(bh(i), bh(i+vec3(1,0,0)), f.x), mix(bh(i+vec3(0,1,0)), bh(i+vec3(1,1,0)), f.x), f.y),
               mix(mix(bh(i+vec3(0,0,1)), bh(i+vec3(1,0,1)), f.x), mix(bh(i+vec3(0,1,1)), bh(i+vec3(1,1,1)), f.x), f.y), f.z); }
  float bfbm(vec3 p){ float s = 0., a = .5; for (int i = 0; i < 5; i++) { s += a * bn(p); p = p * 2.03 + 17.1; a *= .5; } return s; }
`;
const NOISE_GLSL = `varying vec3 vWPos;` + NOISE_FUNCS + `
  vec3 bPerturb(vec3 pos, vec3 n, float h){
    vec3 sx = dFdx(pos), sy = dFdy(pos), r1 = cross(sy, n), r2 = cross(n, sx);
    float det = dot(sx, r1); vec2 dh = vec2(dFdx(h), dFdy(h));
    return normalize(abs(det) * n - sign(det) * (dh.x * r1 + dh.y * r2)); }
`;
function bryceify(mat, o) {
  o = { speckle: 0.15, speckleFreq: 0.05, grain: 0.1, grainFreq: 2, bump: 0, bumpFreq: 1, strata: 0, strataFreq: 0.5, ...o };
  const f = v => (+v).toFixed(5);
  mat.customProgramCacheKey = () => JSON.stringify(o);
  mat.userData.bryce = o;
  mat.onBeforeCompile = sh => {
    sh.vertexShader = 'varying vec3 vWPos;\n' + sh.vertexShader.replace('#include <begin_vertex>',
      '#include <begin_vertex>\n vWPos = (modelMatrix * vec4(transformed, 1.)).xyz;');
    sh.fragmentShader = NOISE_GLSL + sh.fragmentShader
      .replace('#include <color_fragment>', `#include <color_fragment>
        float bS = bfbm(vWPos * ${f(o.speckleFreq)});
        float bG = bn(vWPos * ${f(o.grainFreq)}) + .5 * bn(vWPos * ${f(o.grainFreq * 3.1)});
        diffuseColor.rgb *= 1. + ${f(o.speckle)} * (bS - .5) * 2.5 + ${f(o.grain)} * (bG - .75) * 1.6;
        float band = sin(vWPos.y * ${f(o.strataFreq)} + bS * 9.) * .5 + .5;
        diffuseColor.rgb *= mix(1., .72 + .56 * band, ${f(o.strata)});`)
      .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
        float bH = bfbm(vWPos * ${f(o.bumpFreq)}) + .35 * bn(vWPos * ${f(o.bumpFreq * 5.)});
        normal = bPerturb(-vViewPosition, normal, bH * ${f(o.bump)});`);
  };
  return mat;
}

// ---------- seeded noise ----------
let seed = 1;
const rand = (() => { let s = 1; const f = () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; f.seed = v => s = v; return f; })();
function hash(x, y, sd = seed) {
  let h = Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(sd, 1442695041) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
function vnoise(x, y, sd = seed) {
  const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const a = hash(xi, yi, sd), b = hash(xi + 1, yi, sd), c = hash(xi, yi + 1, sd), d = hash(xi + 1, yi + 1, sd);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const smooth = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };
let phase = 0;
// terrain settings (stored in the scene file as doc.terrain); these defaults reproduce the original look
const TERRAIN_DEFAULTS = { height: 420, size: 286, sharp: 1, rough: 0.5, variety: 0, riverWidth: 380, wiggle: 90, sea: 0, coast: 0,
  terrace: 0, basin: 0, stage: 260, stageX: 0, stageZ: 270, water: true, stageFloor: -14, land: true, waterY: 0 };
const WY = () => (doc && doc.terrain && doc.terrain.waterY) || 0;   // current water height
// presets: wet ones keep water and may flood the stage; land ones switch water off and keep the stage dry.
// Only the river valley and canyon carve a river.
const DRY = { water: false, riverWidth: 0, stageFloor: 3 };
// starting points: each sets the landscape sliders and suggests a palette (the seed and stage spot are kept)
const LANDSCAPES = {
  valley:      { label: 'River valley', pal: 'desert', t: {} },
  canyon:      { label: 'Canyon', pal: 'desert', t: { height: 520, sharp: 0.8, terrace: 0.85, riverWidth: 170, wiggle: 220, stage: 200 } },
  coast:       { label: 'Coastline', pal: 'alpine', t: { height: 300, sharp: 0.6, coast: 1, riverWidth: 0, stageFloor: 2 } },
  archipelago: { label: 'Archipelago', pal: 'alpine', t: { height: 380, size: 340, sharp: 0.3, variety: 0.9, riverWidth: 0, waterY: 80 } },
  lake:        { label: 'Lake basin', pal: 'alien', t: { height: 520, sharp: 0.9, basin: 1, riverWidth: 0, stage: 0 } },
  plains:      { label: 'Desert plains', pal: 'desert', t: { ...DRY, height: 170, size: 420, sharp: 0.2, rough: 0.45, variety: 0.8 } },
  alpine:      { label: 'Alpine meadow', pal: 'alpine', t: { ...DRY, height: 760, sharp: 1, rough: 0.55, stage: 320, stageFloor: 6 } },
  hills:       { label: 'Rolling hills', pal: 'alpine', t: { ...DRY, height: 240, size: 380, sharp: 0.05, rough: 0.42, variety: 0.5, stage: 300 } },
  void:        { label: 'Floating isle (void)', pal: 'void', t: { land: false, water: true, riverWidth: 0, stage: 0 } },
  badlands:    { label: 'Badlands', pal: 'desert', t: { ...DRY, height: 260, size: 220, sharp: 0.55, terrace: 0.7, variety: 0.6, stageFloor: 4 } },
};
let terr = { ...TERRAIN_DEFAULTS };
const meander = z => Math.sin(z * 0.004 + phase) * terr.wiggle;
function heightAt(x, z) {
  const T = terr;
  let a = 1, f = 1 / T.size, s = 0, n = 0;
  for (let i = 0; i < 8; i++) {
    const raw = vnoise(x * f, z * f), r = 1 - Math.abs(raw * 2 - 1);
    const v = raw + (r * r - raw) * T.sharp;               // rolling fbm <-> sharp ridged noise
    s += v * a * (i > 0 ? 0.5 + s / (n || 1) : 1);         // erosion-ish: detail scales with height
    n += a; a *= T.rough; f *= 2.03;
  }
  s /= n;
  // variety: a very broad noise that makes some regions flat plains and others big ranges
  const vary = 1 + T.variety * (vnoise(x * 0.0007 + 71, z * 0.0007 + 19) * 2.4 - 1.1);
  let h = Math.pow(s, 1.6) * T.height * Math.max(vary, 0.05);
  if (T.terrace > 0) {                                     // stepped cliffs, like layered sandstone
    const st = 32, k = h / st, f = k - Math.floor(k);
    h += ((Math.floor(k) + smooth(0.7, 1, f)) * st - h) * T.terrace;
  }
  if (T.riverWidth > 0) {                                  // a winding river valley through the middle
    const valley = smooth(T.riverWidth * 0.08, T.riverWidth, Math.abs(x - meander(z)));
    h = h * valley + (T.waterY - 14) * (1 - valley);
  }
  const ds = Math.hypot(x - T.stageX, z - T.stageZ);
  if (T.basin > 0) {                                        // a ring of mountains around a flooded bowl
    h *= 1 + T.basin * 0.9 * Math.exp(-(((ds - 1050) / 380) ** 2));
    const bowl = smooth(950, 420, ds) * T.basin;
    h = h * (1 - bowl) + (T.waterY - 14) * bowl;
  }
  if (T.coast > 0) {                                       // ocean: land sinks away on the far side
    const o = smooth(250, -1400, z) * T.coast;
    h = h * (1 - o) + (T.waterY - 70) * o;
  }
  if (T.stage > 0) {                                        // the stage: an open, low clearing where the scene is built
    const k = smooth(T.stage * 1.5, T.stage * 0.6, ds);
    h = h * (1 - k) + Math.min(h, T.waterY + T.stageFloor) * k;
  }
  return h - T.sea;   // 'sea' only lowers land in scenes saved before the water level existed
}

// ---------- scene ----------
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, W / H, 1, 6000);

const PALETTES = {
  desert: { low: '#d8b47a', mid: '#b5532e', rock: '#6e4636', high: '#f0e2c8', zenith: '#1d4fa8', horizon: '#e9c9a0', sun: '#fff1d0', water: '#5f8fa0' },
  alpine: { low: '#5d7a32', mid: '#6b6656', rock: '#4c4a44', high: '#ffffff', zenith: '#0b2f8a', horizon: '#b9cfe6', sun: '#ffffff', water: '#3f6f8f' },
  void:   { low: '#5f7d44', mid: '#7d6a4e', rock: '#4a4038', high: '#d8d0c0', zenith: '#04060d', horizon: '#3a4866', sun: '#fff1d6', water: '#13243c' },
  alien:  { low: '#2d8c78', mid: '#7a3b8f', rock: '#3b2148', high: '#ffd6f0', zenith: '#3a0a4a', horizon: '#ff9a6a', sun: '#ffe08a', water: '#6a3f7a' },
};

// sky dome with gradient, sun, and a stratus cloud layer
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: { sunDir: { value: new THREE.Vector3() }, zenith: { value: new THREE.Color() }, horizon: { value: new THREE.Color() }, sunCol: { value: new THREE.Color() }, seed: { value: 0 }, night: { value: 0 }, moonTex: { value: null }, hasMoon: { value: 0 }, moonLod: { value: 0 } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `
    varying vec3 vDir; uniform vec3 sunDir, zenith, horizon, sunCol; uniform float seed, night;
    float sh3(vec3 p){ p = fract(p * .1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
    ${MOON_GLSL}
    float h(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    float n(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);

  if (floating) cpos.y = islandObj.pos[1] + 8 + rand() * 14;   // eye level with the isle: its top, its edge and its reflection
  const ground = (d, s, lift) => { const p = at(d, s); return [p.x, groundHeightOn(islandObj, p.x, p.z) + lift, p.z]; };
  const yaw = Math.atan2(fwd.x, fwd.z);

  // Rules: one hero object on or near the view axis; supporting pieces smaller and fewer; symmetry or a

  // Coordinates: d = distance beyond the island centre (negative = nearer the camera), s = sideways.
  const taken = [];

  const on = (d, s, lift) => ground(150 + d, s, lift);

function traceContext() {

function setMode(m) {

function renderFinal(ray) {

  setTimeout(() => requestAnimationFrame(() => {
    if (my !== job) return;

      renderer.setRenderTarget(rt); renderer.setClearColor(0, 1); renderer.clear(); renderer.render(scene, camera);
      blit();
      msg.textContent = `Render complete - ${((performance.now() - t0) / 1000).toFixed(1)} sec - click the view or Esc to edit`;
      return;
    }
    const info = tracer.build(traceContext());
    const tBuild = (performance.now() - t0) / 1000;
    accRT.setSize(W, H);
    renderer.setRenderTarget(accRT); renderer.setClearColor(0, 0); renderer.clear(); renderer.setClearColor(0, 1);
    tracer.material.uniforms.res.value.set(W, H);

      if (pass < MAX_PASSES) requestAnimationFrame(step);
      else msg.textContent = `Ray trace complete - ${MAX_PASSES} passes in ${((performance.now() - t1) / 1000).toFixed(1)} sec - click the view or Esc to edit`;

  }
  const d = base;
  const old = d.objects.find(o => o.role === 'base') || d.objects.find(o => o.type === 'terrain' || o.type === 'floater');
  d.terrain = terrain;
  const wy = terrain.waterY || 0, floating = terrain.land === false, wet = terrain.water && terrain.stageFloor < 0 && terrain.stage > 0;
  const cx = old ? old.pos[0] : terrain.stageX, cz = old ? old.pos[2] : terrain.stageZ;
  const nb = floating
    ? mkObj('floater', { name: 'Floating isle', mat: 'land', color: '#cccccc', pos: [cx, wy + 80, cz], terrain: { ...FLOAT_DEFAULTS, tseed: (old && old.terrain && old.terrain.tseed) || 1 } })
    : mkObj('terrain', { name: wet ? 'Island' : 'Knoll', mat: 'land', color: '#cccccc', pos: [cx, wy, cz], terrain: { ...TOBJ_DEFAULTS, tseed: (old && old.terrain && old.terrain.tseed) || 1 } });
  nb.role = 'base'; nb.id = old ? old.id : nb.id;
  // anything standing on the old base moves with it: same offset above the new surface at the same x/z
  if (old) for (const o of d.objects) {
    if (o === old || o.type === 'clouds') continue;
    if (Math.hypot(o.pos[0] - cx, o.pos[2] - cz) > 110) continue;
    const off = o.pos[1] - groundHeightOn(old, o.pos[0], o.pos[2]);
    if (off > 80) continue;   // high flyers stay where they are
    o.pos[1] = groundHeightOn(nb, o.pos[0], o.pos[2]) + off;
  }
  const dy = nb.pos[1] - (old ? old.pos[1] : 0);
  d.camera.pos[1] += dy; d.camera.target[1] += dy;
  d.objects = old ? d.objects.map(o => o === old ? nb : o) : [nb, ...d.objects];
  doc = d; applyDoc();
}

// ---------- files ----------
function newRandom() {
  const keys = Object.keys(LANDSCAPES), k = keys[(Math.random() * keys.length) | 0], L = LANDSCAPES[k];
  doc = generateDoc((Math.random() * 1e9) | 0, L.pal, { ...TERRAIN_DEFAULTS, ...L.t }); applyDoc();
  msg.textContent = `New random scene: ${L.label}, ${doc.layout} layout`;
}
function newSameLandscape() {
  doc = generateDoc((Math.random() * 1e9) | 0, doc.palette, doc.terrain); applyDoc(); msg.textContent = `New scene, same landscape: ${doc.layout} layout`;
}
function newEmpty() {
  const d = generateDoc((Math.random() * 1e9) | 0, doc ? doc.palette : 'desert', doc && doc.terrain);
  d.objects = []; doc = d; applyDoc(); msg.textContent = 'Empty scene - add objects from the Create panel';
}
function saveDoc() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(doc, null, 1)], { type: 'application/json' }));
  a.download = (doc.name || 'untitled') + '.tsc.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  msg.textContent = `Saved ${a.download}`;
}
$('openFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.objects) || !d.camera || !d.sky) throw new Error('not a Terrascape scene');
    d.name = f.name.replace(/\.tsc\.json$|\.json$|\.tsc$/i, '');
    msg.textContent = `Loading models for ${f.name}…`;
    await loadDocModels(d);
    doc = d; applyDoc(); msg.textContent = `Opened ${f.name}`;
  } catch (err) { dialog('Open', `Couldn't open that file: ${err.message}`); }
});

// ---------- Sky & Fog quick controls ----------
function skyChange(fn) { fn(doc.sky); applyEnvironment(); updateReflections(); if (sel === 'terrain') renderTerrainPanel(); if (mode !== 'edit') renderFinal(mode === 'ray'); }
function setPalette(p) { doc.palette = p; applyEnvironment(); updateReflections(); if (mode !== 'edit') renderFinal(mode === 'ray'); }

// ---------- dialogs ----------
function dialog(title, html) {
  const d = document.createElement('div'); d.className = 'dialog';
  d.innerHTML = `<div class="title"><span>${title}</span><span class="tb"><b>×</b></span></div><div class="body">${html}</div><div class="ok"><button>OK</button></div>`;
  $('win').appendChild(d);
  const close = () => d.remove();
  d.querySelector('.ok button').onclick = close; d.querySelector('.tb b').onclick = close;
}
const HELP = `<table>
  <tr><td>Drag</td><td>orbit the camera</td></tr><tr><td>Right-drag</td><td>pan</td></tr><tr><td>Wheel</td><td>zoom</td></tr>
  <tr><td>Click</td><td>select an object (click the landscape for its settings)</td></tr><tr><td>W / E / R</td><td>move / rotate / scale</td></tr>
  <tr><td>F</td><td>frame the selection</td></tr><tr><td>Ctrl/⌘ D</td><td>duplicate</td></tr><tr><td>Delete</td><td>delete</td></tr>
  <tr><td>Enter</td><td>render</td></tr><tr><td>Shift+Enter</td><td>ray trace</td></tr><tr><td>Esc</td><td>back to edit / deselect</td></tr>
  <tr><td>Ctrl/⌘ S</td><td>save scene</td></tr><tr><td>Ctrl/⌘ O</td><td>open scene</td></tr></table>`;

// ---------- menus ----------
const sep = '-';
function menuSpec() {
  return {
    File: [
      ['New Scene…', () => openWizard()], ['New Random Scene', newRandom], ['New Scene, Same Landscape', newSameLandscape], ['New Empty Scene', newEmpty], sep,
      ['Open…', () => $('openFile').click(), 'Ctrl+O'], ['Save', saveDoc, 'Ctrl+S'],
    ],
    Edit: [
      ['Duplicate', duplicate, 'Ctrl+D', !isObj()], ['Delete', deleteSel, 'Del', !isObj()], sep,
      ['Move', () => setGizmo('translate'), 'W', false, gizmo.mode === 'translate'], ['Rotate', () => setGizmo('rotate'), 'E', !isObj(), gizmo.mode === 'rotate'],
      ['Scale', () => setGizmo('scale'), 'R', !isObj(), gizmo.mode === 'scale'], sep,
      ['Drop to Ground', dropToGround, '', !isObj()], ['Deselect', () => select(null), 'Esc'],
    ],
    Objects: [
      ...Object.entries(TYPES).map(([k, v]) => [v, () => create(k)]), sep,
      ['Browse Poly Haven…', () => openBrowser()], sep,
      ...['tree', 'trunk', 'bust', 'boulder', 'rock'].map(k => [MODELS[k].label + ' (Poly Haven)', () => create('model', { model: k })]),
    ],
    'Sky & Fog': [
      ...Object.keys(PALETTES).map(p => [p[0].toUpperCase() + p.slice(1), () => setPalette(p), '', false, doc.palette === p]), sep,
      ['Randomize Sky', () => skyChange(s => { s.elev = 8 + Math.random() * 30; s.az = (Math.random() - 0.5) * 92; s.cloudSeed = Math.random() * 100; })],
      ['Sky Settings…', () => { if (mode !== 'edit') setMode('edit'); landTab = 'Sky'; select('terrain'); }],
      ['Change World…', () => openWizard(0, 'world')], ['Change Look…', () => openWizard(0, 'look')], sep,
      ['Landscape Settings…', () => { if (mode !== 'edit') setMode('edit'); select('terrain'); }],
      ['New Terrain', () => { doc.seed = (Math.random() * 1e9) | 0; applyEnvironment(); updateReflections(); if (sel === 'terrain') renderTerrainPanel(); }], sep,
      ['Night (moon & stars)', () => skyChange(s => s.night = !s.night), '', false, !!doc.sky.night],
      ['Add Cloud Layer', () => create('clouds')], sep,
      ['Sun Higher', () => skyChange(s => s.elev = Math.min(85, s.elev + 5))], ['Sun Lower', () => skyChange(s => s.elev = Math.max(1, s.elev - 5))],
      ['Sun Left', () => skyChange(s => s.az -= 15)], ['Sun Right', () => skyChange(s => s.az += 15)], sep,
      ['Thicker Fog', () => skyChange(s => s.fog *= 1.3)], ['Thinner Fog', () => skyChange(s => s.fog /= 1.3)],
    ],
    View: [
      ['Solid', () => { viewMode = 'solid'; setMode('edit'); }, '', false, viewMode === 'solid'],
      ['Wireframe', () => { viewMode = 'wire'; setMode('edit'); }, '', false, viewMode === 'wire'], sep,
      ['Frame Selection', frameSel, 'F', !sel || sel === 'terrain'],
    ],
    Render: [
      ['Render', () => renderFinal(false), 'Enter'], ['Ray Trace (current size)', () => renderFinal(true), 'Shift+Enter'], ['Back to Edit', () => setMode('edit'), 'Esc', mode === 'edit'], sep,
      ['256 Colors', () => setColors(2), '', false, colorMode === 2], ['Thousands of Colors', () => setColors(1), '', false, colorMode === 1],
      ['Millions of Colors', () => setColors(0), '', false, colorMode === 0], sep,
      ...[['400', '400 x 300'], ['640', '640 x 480'], ['800', '800 x 600'], ['full', 'Full Resolution']].map(([k, l]) => [l, () => setResolution(k), '', false, resKey === k]),
    ],
    Help: [['Controls', () => dialog('Controls', HELP)], ['About Terrascape', () => dialog('About Terrascape',
      `<b>Terrascape 2.0</b><br>A 90s-style landscape renderer built on three.js.<br>Raster preview, supersampled render, and a Whitted ray tracer.<br>Models from Poly Haven (CC0).`)]],
  };
}
const bar = $('menubar');
let openMenu = null, dropEl = null;
function closeMenu() { if (dropEl) dropEl.remove(); dropEl = null; if (openMenu) openMenu.classList.remove('open'); openMenu = null; }
function showMenu(el) {
  closeMenu();
  openMenu = el; el.classList.add('open');
  const items = menuSpec()[el.dataset.m];
  dropEl = document.createElement('div'); dropEl.className = 'dropdown';
  dropEl.style.left = el.offsetLeft + 'px'; dropEl.style.top = (el.offsetTop + el.offsetHeight) + 'px';
  for (const it of items) {
    if (it === sep) { dropEl.insertAdjacentHTML('beforeend', '<div class="sep"></div>'); continue; }
    const [label, fn, key = '', disabled = false, checked = false] = it;
    const d = document.createElement('div');
    d.className = 'item' + (checked ? ' checked' : '');
    if (disabled) d.style.color = '#808080';
    d.innerHTML = `<span>${label}</span><span class="k">${key}</span>`;
    d.onclick = e => { e.stopPropagation(); closeMenu(); if (!disabled) fn(); };
    dropEl.appendChild(d);
  }
  bar.appendChild(dropEl);
}
bar.innerHTML = ['File', 'Edit', 'Objects', 'Sky & Fog', 'View', 'Render', 'Help'].map(m => `<div data-m="${m}">${m}</div>`).join('');
bar.querySelectorAll('[data-m]').forEach(el => {
  el.addEventListener('click', e => { e.stopPropagation(); if (openMenu === el) closeMenu(); else showMenu(el); });
  el.addEventListener('mouseenter', () => { if (openMenu && openMenu !== el) showMenu(el); });
});
document.addEventListener('click', closeMenu);

// ---------- buttons and keys ----------
$('btnRender').onclick = () => renderFinal(false);
// Ray Trace drops down a little menu of resolutions; picking one sets it and starts tracing
const RES_CHOICES = [['400', '400 x 300', 'fast'], ['640', '640 x 480', ''], ['800', '800 x 600', ''], ['full', 'Full resolution', 'slow']];
function popupMenu(anchor, title, items) {
  closeMenu();
  const win = $('win').getBoundingClientRect(), r = anchor.getBoundingClientRect();
  dropEl = document.createElement('div'); dropEl.className = 'dropdown';
  dropEl.style.left = (r.left - win.left) + 'px'; dropEl.style.top = (r.bottom - win.top) + 'px';
  dropEl.innerHTML = `<div class="hint" style="padding:2px 8px 3px 20px;font-weight:bold">${title}</div><div class="sep"></div>`;
  for (const [label, fn, key = '', checked = false] of items) {
    const d = document.createElement('div');
    d.className = 'item' + (checked ? ' checked' : '');
    d.innerHTML = `<span>${label}</span><span class="k">${key}</span>`;
    d.onclick = e => { e.stopPropagation(); closeMenu(); fn(); };
    dropEl.appendChild(d);
  }
  $('win').appendChild(dropEl);
}
$('btnRay').onclick = e => {
  e.stopPropagation();
  if (dropEl && openMenu === null && dropEl.dataset.ray) return closeMenu();
  popupMenu($('btnRay'), 'Ray trace at', RES_CHOICES.map(([k, label, note]) =>
    [label, () => { setResolution(k); renderFinal(true); }, note, resKey === k]));
  dropEl.dataset.ray = '1';
};
$('btnEdit').onclick = () => setMode('edit');
addEventListener('keydown', e => {
  if (e.target.matches('input, select, textarea')) return;
  const k = e.key.toLowerCase(), mod = e.metaKey || e.ctrlKey;
  if (mod && k === 's') { e.preventDefault(); saveDoc(); return; }
  if (mod && k === 'o') { e.preventDefault(); $('openFile').click(); return; }
  if (mod && k === 'd') { e.preventDefault(); duplicate(); return; }
  if (k === 'escape') { closeMenu(); if (mode !== 'edit') setMode('edit'); else select(null); return; }
  if (k === 'enter') { e.preventDefault(); renderFinal(e.shiftKey); return; }
  if (mode !== 'edit' || mod) return;
  if (k === 'w') setGizmo('translate'); else if (k === 'e') setGizmo('rotate'); else if (k === 'r') setGizmo('scale');
  else if (k === 'f') frameSel(); else if (k === 'delete' || k === 'backspace') deleteSel();
});

// ---------- start up ----------
startPixelEmoji(document.body);   // 16-colour pixel icons instead of glossy system emoji
setResolution('400');
renderInspector();
msg.textContent = 'Loading Poly Haven models...';
assetsReady.then(() => {
  doc = generateDoc(1234, 'desert');
  applyDoc();
  frame();
  openWizard();   // start by choosing a world
  // build picking structures for the big models in the background so the first click is quick
  setTimeout(() => Object.values(models).forEach(ensureBVH), 500);
});
</script>
</body>
</html>
