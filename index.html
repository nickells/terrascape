<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Terrascape 2.0</title>
<style>
  html,body{margin:0;height:100%;background:#008080;font:11px Verdana,"MS Sans Serif",Geneva,sans-serif;}
  *{-webkit-font-smoothing:none;-moz-osx-font-smoothing:auto;font-smooth:never;text-rendering:optimizeSpeed;}
  body{display:flex;align-items:center;justify-content:center;}
  .win{background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;box-shadow:inset -1px -1px #808080,inset 1px 1px #dfdfdf;padding:3px;position:relative;}
  .title{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:bold;padding:3px 4px;display:flex;justify-content:space-between;align-items:center;}
  .title .tb b{display:inline-block;width:14px;height:12px;background:#c0c0c0;color:#000;border:1px solid;border-color:#fff #000 #000 #fff;text-align:center;line-height:11px;font-size:9px;margin-left:2px;}
  .menubar{display:flex;padding:2px 0;position:relative;user-select:none;}
  .menubar>div{padding:2px 7px;cursor:default;}
  .menubar>div.open{background:#000080;color:#fff;}
  .dropdown{position:absolute;z-index:40;max-height:540px;overflow-y:auto;background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;box-shadow:inset -1px -1px #808080,2px 2px 0 rgba(0,0,0,.3);padding:2px;min-width:190px;}
  .dropdown .item{display:flex;justify-content:space-between;gap:18px;padding:3px 8px 3px 20px;position:relative;white-space:nowrap;cursor:default;}
  .dropdown .item:hover{background:#000080;color:#fff;}
  .dropdown .item.checked::before{content:"✓";position:absolute;left:6px;}
  .dropdown .item .k{opacity:.75;}
  .dropdown .item.off{color:#808080;} .dropdown .item.off:hover{background:none;color:#808080;}
  .dropdown .item.head{color:#404040;font-weight:bold;padding-left:8px;} .dropdown .item.head:hover{background:none;color:#404040;}
  .dropdown .sep{border-top:1px solid #808080;border-bottom:1px solid #fff;margin:3px 2px;}
  .main{display:flex;gap:4px;align-items:flex-start;}
  .side{display:flex;flex-direction:column;gap:4px;width:196px;height:604px;}
  .win.loading .side{pointer-events:none;opacity:.55;}
  #inspector{flex:1 1 auto;min-height:0;overflow-y:auto;}
  button,select,input{font:inherit;}
  button{background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;box-shadow:inset -1px -1px #808080;padding:3px 4px;cursor:pointer;}
  button:disabled{color:#808080;text-shadow:1px 1px #fff;cursor:default;}
  button:disabled:active{border-color:#fff #000 #000 #fff;box-shadow:inset -1px -1px #808080;}
  button.pressed,button:active{border-color:#000 #fff #fff #000;box-shadow:inset 1px 1px #808080;}
  button.big{text-align:left;padding:4px 6px;}
  fieldset{border:1px solid #808080;box-shadow:1px 1px #fff;padding:4px;margin:0;}
  legend{padding:0 2px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:3px;}
  .grid2 button{padding:3px 2px;}
  select,input[type=text],input[type=number]{background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;padding:1px 2px;box-sizing:border-box;min-width:0;}
  select{width:100%;}
  input[type=color]{width:100%;height:20px;padding:0;border:2px solid;border-color:#808080 #fff #fff #808080;background:#c0c0c0;}
  .row{display:grid;grid-template-columns:54px 1fr;align-items:center;gap:3px;margin:3px 0;}
  .xyz{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;}
  .xyz input{width:100%;}
  .xyz input[type=number]{-moz-appearance:textfield;} .xyz input::-webkit-inner-spin-button,.xyz input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
  .xyz input[data-ax='0']{border-left-color:#c03030;} .xyz input[data-ax='1']{border-left-color:#20a020;} .xyz input[data-ax='2']{border-left-color:#3050d0;}
  .axes{margin:4px 0 -2px;} .axes span{text-align:center;color:#404040;font-size:10px;}
  .actions{position:sticky;bottom:-4px;background:#c0c0c0;margin:4px -4px -4px;padding:4px;border-top:1px solid #808080;box-shadow:0 -1px #fff inset;}
  .sw{display:flex;height:6px;margin-top:2px;border:1px solid #808080;} .sw i{flex:1;}
  .hint{color:#404040;line-height:1.35;padding:2px;}
  .modes{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;margin:1px 0 4px;} .modes button{padding:2px 1px;}
  .modes button.on{border-color:#000 #fff #fff #000;box-shadow:inset 1px 1px #808080;background:#d8d8d8;font-weight:bold;}
  .slider.off{color:#808080;}
  .slider{display:grid;grid-template-columns:72px 1fr 40px;align-items:center;gap:2px;margin:1px 0;}
  .slider>div{display:contents;}
  .slider>div>span:first-child{grid-column:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .slider>input{grid-column:2;grid-row:1;width:100%;margin:0;height:16px;}
  .slider>div>span:last-child{grid-column:3;grid-row:1;text-align:right;}
  .tabs{display:flex;gap:0;margin:2px 0 -2px;position:relative;z-index:1;}
  .tabs button{flex:1;border-bottom:none;padding:2px 0;box-shadow:none;margin-right:-2px;background:#c0c0c0;}
  .tabs button.on{padding-bottom:4px;margin-top:-2px;}
  .ctabs .tabpage{box-sizing:border-box;margin-bottom:0;}   /* Create sizes to its buttons; Objects copies that height */
  .listbox{height:100%;overflow-y:auto;background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;box-sizing:border-box;}
  .li{display:flex;align-items:center;gap:4px;padding:1px 3px;white-space:nowrap;cursor:default;}
  .li .g{width:12px;text-align:center;flex:none;} .li .nm{overflow:hidden;text-overflow:ellipsis;flex:1;} .li .x{color:#808080;font-size:10px;}
  .li.sel{background:#000080;color:#fff;} .li.sel .x{color:#c0c0ff;} .li.hid .nm,.li.hid .g{color:#a0a0a0;} .li.sel.hid .nm{color:#b0b0d0;}
  .li .eye{flex:none;width:14px;text-align:center;cursor:pointer;} .li .eye:hover{outline:1px dotted currentColor;}
  .li.land{border-bottom:1px dotted #c0c0c0;}
  .tabpage{border:2px solid;border-color:#fff #000 #000 #fff;box-shadow:inset -1px -1px #808080;padding:4px;margin-bottom:4px;}
  .dialog.wiz{left:8px;top:58px;transform:none;width:340px;max-width:none;}
  .wiz .body{height:514px;overflow-y:auto;box-sizing:border-box;}
  .shade{position:absolute;inset:0;z-index:29;cursor:not-allowed;}
  .wiz .choices{display:grid;gap:3px;margin:3px 0 6px;} .wiz .c2{grid-template-columns:1fr 1fr;} .wiz .c3{grid-template-columns:1fr 1fr 1fr;}
  .wiz .choice{padding:4px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;} .wiz .choice.on{border-color:#000 #fff #fff #000;box-shadow:inset 1px 1px #808080;background:#d8d8d8;font-weight:bold;}
  .wiz .wbtns{display:flex;justify-content:space-between;padding:0 10px 10px;} .wiz .wbtns button{min-width:64px;margin-left:4px;}
  .dialog.ph{max-width:none;width:600px;top:48%;}
  .phbar{display:grid;grid-template-columns:1fr 150px 130px;gap:4px;padding:6px 6px 4px;}
  .phbar input{width:100%;}
  .phgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:4px 6px;height:380px;overflow-y:auto;background:#fff;margin:0 6px;border:2px solid;border-color:#808080 #fff #fff #808080;align-content:start;}
  .tile{display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px;min-width:0;}
  .tile img{width:84px;height:84px;object-fit:contain;background:#dcdcdc;}
  .tile .nm{width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;}
  .tile .pc{color:#555;font-size:10px;} .tile .pc.heavy,.phfoot .heavy{color:#a02020;}
  .tile.busy{opacity:.5;cursor:wait;}
  .phfoot{display:flex;justify-content:space-between;padding:4px 8px 6px;color:#404040;}
  .well{border:2px solid;border-color:#808080 #fff #fff #808080;background:#000;line-height:0;}
  canvas{width:800px;height:600px;image-rendering:pixelated;display:block;outline:none;}
  .status{display:flex;gap:3px;margin-top:3px;}
  .status div{border:1px solid;border-color:#808080 #fff #fff #808080;padding:2px 4px;}
  .status #msg{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
  .status #modeLbl{flex:0 0 70px;} .status #pct{flex:0 0 130px;padding:0;}
  #resSel{border:0;background:transparent;width:100%;padding:1px 2px;cursor:pointer;}
  .dialog{position:absolute;z-index:30;left:50%;top:40%;transform:translate(-50%,-50%);background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;box-shadow:inset -1px -1px #808080,3px 3px 0 rgba(0,0,0,.35);min-width:320px;max-width:420px;}
  .dialog .body{padding:10px 12px;line-height:1.5;}
  .dialog .body table{border-collapse:collapse;} .dialog .body td{padding:1px 10px 1px 0;vertical-align:top;}
  .dialog .ok{display:flex;justify-content:center;gap:6px;padding:0 0 10px;} .dialog .ok button{min-width:70px;}
  .dialog .body input[type=text]{width:100%;margin-top:4px;}
</style>
</head>
<body>
<div class="win loading" id="win">
  <div class="title"><span>Terrascape 2.0 - [<span id="docname">untitled</span>]</span><span class="tb"><b>_</b><b>□</b><b>×</b></span></div>
  <div class="menubar" id="menubar"></div>
  <div class="main">
    <div class="side">
      <div class="grid2" id="renderBtns">
        <button class="big" id="btnRender" title="Quick supersampled render at the output size (Enter)">▶ Render</button>
        <button class="big" id="btnRay" title="Ray trace at the output size (Shift+Enter)">✦ Ray Trace</button>
        <button id="btnEdit" title="Leave the render and keep editing (Esc)" disabled>◀ Back to Edit</button>
        <button id="btnSaveImg" title="Save the rendered picture as a PNG (Ctrl+E)">💾 Save Image</button>
      </div>
      <div class="ctabs">
        <div class="tabs"><button data-ctab="create" class="on">Create</button><button data-ctab="list">Objects</button></div>
        <div class="tabpage" id="createPage">
          <div class="grid2" id="createBtns"></div>
          <button id="btnPH" style="width:100%;margin-top:3px">🌐 Browse Poly Haven…</button>
        </div>
        <div class="tabpage" id="listPage" style="display:none"><div class="listbox" id="objList"></div></div>
      </div>
      <fieldset id="inspector"></fieldset>
    </div>
    <div class="well"><canvas id="view" tabindex="0"></canvas></div>
  </div>
  <div class="status"><div id="msg">Loading...</div><div id="modeLbl">Edit</div><div id="pct"><select id="resSel" title="Output size for Render, Ray Trace and Save Image">
    <option value="400">Size: 400 x 300</option><option value="640">Size: 640 x 480</option><option value="800">Size: 800 x 600</option><option value="full">Size: Full</option></select></div></div>
</div>
<input type="file" id="openFile" accept=".tsc,.json" hidden>

{ "imports": {
  "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/",

</script>
<script type="module">
import * as THREE from 'three';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { computeBoundsTree, disposeBoundsTree, acceleratedRaycast } from 'three-mesh-bvh';
import { createTracer, KIND, MOON_GLSL, MOON_R } from './tracer.js';
import { startPixelEmoji } from './emoji.js';

// fast click-picking on the big Poly Haven meshes
THREE.BufferGeometry.prototype.computeBoundsTree = computeBoundsTree;
THREE.BufferGeometry.prototype.disposeBoundsTree = disposeBoundsTree;
THREE.Mesh.prototype.raycast = acceleratedRaycast;


let W = 400, H = 300, SS = 3;   // output size and supersampling factor (SS x SS samples per pixel)
const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.autoClear = false;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const rt = new THREE.WebGLRenderTarget(W * SS, H * SS, {
  type: THREE.HalfFloatType, minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
});

// ---------- ground fog: exp2 distance fog plus a layer that thickens toward y=0 ----------
THREE.ShaderChunk.fog_pars_vertex += `\n#ifdef USE_FOG\n varying float vFogY;\n#endif\n`;
THREE.ShaderChunk.fog_vertex += `\n#ifdef USE_FOG\n vFogY = (modelMatrix * vec4(position, 1.0)).y;\n#endif\n`;
THREE.ShaderChunk.fog_pars_fragment += `\n#ifdef USE_FOG\n varying float vFogY;\n#endif\n`;
THREE.ShaderChunk.fog_fragment = THREE.ShaderChunk.fog_fragment.replace(
  'gl_FragColor.rgb = mix(',
  `#ifdef FOG_EXP2
     fogFactor = max(fogFactor, 1.0 - exp(-vFogDepth * fogDensity * 1.1 * exp(-max(vFogY, 0.0) / 18.0)));
   #endif
   gl_FragColor.rgb = mix(`);

// ---------- Bryce-style procedural materials ----------
// solid 3D noise evaluated per pixel: colour speckle, fine grain, altitude strata and sub-pixel bump.
// Supersampling then averages the shimmer into that "smooth but noisy" look.
const NOISE_FUNCS = `
  float bh(vec3 p){ p = fract(p * .1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
  float bn(vec3 p){ vec3 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
    return mix(mix(mix(bh(i), bh(i+vec3(1,0,0)), f.x), mix(bh(i+vec3(0,1,0)), bh(i+vec3(1,1,0)), f.x), f.y),
               mix(mix(bh(i+vec3(0,0,1)), bh(i+vec3(1,0,1)), f.x), mix(bh(i+vec3(0,1,1)), bh(i+vec3(1,1,1)), f.x), f.y), f.z); }
  float bfbm(vec3 p){ float s = 0., a = .5; for (int i = 0; i < 5; i++) { s += a * bn(p); p = p * 2.03 + 17.1; a *= .5; } return s; }
`;
const NOISE_GLSL = `varying vec3 vWPos;` + NOISE_FUNCS + `
  vec3 bPerturb(vec3 pos, vec3 n, float h){
    vec3 sx = dFdx(pos), sy = dFdy(pos), r1 = cross(sy, n), r2 = cross(n, sx);
    float det = dot(sx, r1); vec2 dh = vec2(dFdx(h), dFdy(h));
    return normalize(abs(det) * n - sign(det) * (dh.x * r1 + dh.y * r2)); }
`;
function bryceify(mat, o) {
  o = { speckle: 0.15, speckleFreq: 0.05, grain: 0.1, grainFreq: 2, bump: 0, bumpFreq: 1, strata: 0, strataFreq: 0.5, ...o };
  const f = v => (+v).toFixed(5);
  mat.customProgramCacheKey = () => JSON.stringify(o);
  mat.userData.bryce = o;
  mat.onBeforeCompile = sh => {
    sh.vertexShader = 'varying vec3 vWPos;\n' + sh.vertexShader.replace('#include <begin_vertex>',
      '#include <begin_vertex>\n vWPos = (modelMatrix * vec4(transformed, 1.)).xyz;');
    sh.fragmentShader = NOISE_GLSL + sh.fragmentShader
      .replace('#include <color_fragment>', `#include <color_fragment>
        float bS = bfbm(vWPos * ${f(o.speckleFreq)});
        float bG = bn(vWPos * ${f(o.grainFreq)}) + .5 * bn(vWPos * ${f(o.grainFreq * 3.1)});
        diffuseColor.rgb *= 1. + ${f(o.speckle)} * (bS - .5) * 2.5 + ${f(o.grain)} * (bG - .75) * 1.6;
        float band = sin(vWPos.y * ${f(o.strataFreq)} + bS * 9.) * .5 + .5;
        diffuseColor.rgb *= mix(1., .72 + .56 * band, ${f(o.strata)});`)
      .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
        float bH = bfbm(vWPos * ${f(o.bumpFreq)}) + .35 * bn(vWPos * ${f(o.bumpFreq * 5.)});
        normal = bPerturb(-vViewPosition, normal, bH * ${f(o.bump)});`);
  };
  return mat;
}

// world-space tile grid on a standard material; same pattern as the ray tracer's tileAlb()
function tileify(mat, size) {
  mat.customProgramCacheKey = () => 'tile' + size;
  mat.onBeforeCompile = sh => {
    sh.vertexShader = 'varying vec3 vTPos; varying vec3 vTN;\n' + sh.vertexShader.replace('#include <begin_vertex>',
      '#include <begin_vertex>\n vTPos = (modelMatrix * vec4(transformed, 1.)).xyz; vTN = normalize(mat3(modelMatrix) * objectNormal);');
    sh.fragmentShader = 'varying vec3 vTPos; varying vec3 vTN;\n' + sh.fragmentShader.replace('#include <color_fragment>', `#include <color_fragment>
      { vec3 a = abs(vTN); vec2 uv = a.x > a.y && a.x > a.z ? vTPos.yz : a.y > a.z ? vTPos.xz : vTPos.xy;
        vec2 f = fract(uv / ${(+size).toFixed(3)}), e = min(f, 1. - f);
        if (min(e.x, e.y) < .06) diffuseColor.rgb *= .55; }`);
  };
  return mat;
}

// ---------- seeded noise ----------
let seed = 1;
const rand = (() => { let s = 1; const f = () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; f.seed = v => s = v; return f; })();
function hash(x, y, sd = seed) {
  let h = Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(sd, 1442695041) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
function vnoise(x, y, sd = seed) {
  const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const a = hash(xi, yi, sd), b = hash(xi + 1, yi, sd), c = hash(xi, yi + 1, sd), d = hash(xi + 1, yi + 1, sd);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const smooth = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };
let phase = 0;
// terrain settings (stored in the scene file as doc.terrain); these defaults reproduce the original look
const TERRAIN_DEFAULTS = { height: 420, size: 286, sharp: 1, rough: 0.5, variety: 0, riverWidth: 380, wiggle: 90, sea: 0, coast: 0,
  terrace: 0, basin: 0, stage: 260, stageX: 0, stageZ: 270, water: true, stageFloor: -14, land: true, waterY: 0, floor: '', floorTile: 0 };
const WY = () => (doc && doc.terrain && doc.terrain.waterY) || 0;   // current water height
// presets: wet ones keep water and may flood the stage; land ones switch water off and keep the stage dry.
// Only the river valley and canyon carve a river.
const DRY = { water: false, riverWidth: 0, stageFloor: 3 };
// starting points: each sets the landscape sliders and suggests a palette (the seed and stage spot are kept)
const LANDSCAPES = {
  valley:      { label: 'River valley', pal: 'desert', t: {} },
  canyon:      { label: 'Canyon', pal: 'desert', base: { shape: 'mesa', height: 30, s: 1.25 }, t: { height: 520, sharp: 0.8, terrace: 0.85, riverWidth: 170, wiggle: 220, stage: 200 } },
  coast:       { label: 'Coastline', pal: 'alpine', base: { shape: 'outcrop', height: 24, sharp: 0.8 }, t: { height: 300, sharp: 0.6, coast: 1, riverWidth: 0, stageFloor: 2 } },
  archipelago: { label: 'Archipelago', pal: 'alpine', t: { height: 380, size: 340, sharp: 0.3, variety: 0.9, riverWidth: 0, waterY: 80 } },
  lake:        { label: 'Lake basin', pal: 'alien', base: { shape: 'crater', height: 18, s: 1.4 }, t: { height: 520, sharp: 0.9, basin: 1, riverWidth: 0, stage: 0 } },
  plains:      { label: 'Desert plains', pal: 'desert', base: { shape: 'dunes', height: 12, s: 1.6 }, t: { ...DRY, height: 170, size: 420, sharp: 0.2, rough: 0.45, variety: 0.8 } },
  alpine:      { label: 'Alpine meadow', pal: 'alpine', base: { shape: 'outcrop', height: 26, sharp: 0.9 }, t: { ...DRY, height: 760, sharp: 1, rough: 0.55, stage: 320, stageFloor: 6 } },
  hills:       { label: 'Rolling hills', pal: 'alpine', t: { ...DRY, height: 240, size: 380, sharp: 0.05, rough: 0.42, variety: 0.5, stage: 300 } },
  void:        { label: 'Floating isle (void)', pal: 'void', t: { land: false, water: true, riverWidth: 0, stage: 0 } },
  badlands:    { label: 'Badlands', pal: 'desert', base: { shape: 'mesa', height: 34, s: 1.15 }, t: { ...DRY, height: 260, size: 220, sharp: 0.55, terrace: 0.7, variety: 0.6, stageFloor: 4 } },
};
let terr = { ...TERRAIN_DEFAULTS };
const meander = z => Math.sin(z * 0.004 + phase) * terr.wiggle;
function heightAt(x, z) {
  const T = terr;
  let a = 1, f = 1 / T.size, s = 0, n = 0;
  for (let i = 0; i < 8; i++) {
    const raw = vnoise(x * f, z * f), r = 1 - Math.abs(raw * 2 - 1);
    const v = raw + (r * r - raw) * T.sharp;               // rolling fbm <-> sharp ridged noise
    s += v * a * (i > 0 ? 0.5 + s / (n || 1) : 1);         // erosion-ish: detail scales with height
    n += a; a *= T.rough; f *= 2.03;
  }
  s /= n;
  // variety: a very broad noise that makes some regions flat plains and others big ranges
  const vary = 1 + T.variety * (vnoise(x * 0.0007 + 71, z * 0.0007 + 19) * 2.4 - 1.1);
  let h = Math.pow(s, 1.6) * T.height * Math.max(vary, 0.05);
  if (T.terrace > 0) {                                     // stepped cliffs, like layered sandstone
    const st = 32, k = h / st, f = k - Math.floor(k);
    h += ((Math.floor(k) + smooth(0.7, 1, f)) * st - h) * T.terrace;
  }
  if (T.riverWidth > 0) {                                  // a winding river valley through the middle

        scale: Array(3).fill((opts.base && opts.base.s) || 1), terrain: { ...TOBJ_DEFAULTS, ...baseTerrain(opts.base), tseed: (rand() * 1e6) | 0 } });
  if (floating) cpos.y = islandObj.pos[1] + 8 + rand() * 14;   // eye level with the isle: its top, its edge and its reflection
  const baseTop = !floating && opts.base ? groundHeightOn(islandObj, isl.x, isl.z) : null;
  if (baseTop !== null) {   // look onto a tall base (mesa, crater rim, outcrop), not into its side: clear its highest point toward the camera
    const R = (PATCH / 2) * ((opts.base.s) || 1), toCam = cpos.clone().sub(isl).setY(0).normalize();
    let rim = baseTop;
    for (let i = 0; i <= 24; i++) { const p = isl.clone().addScaledVector(toCam, R * i / 24); rim = Math.max(rim, groundHeightOn(islandObj, p.x, p.z)); }
    cpos.y = Math.max(cpos.y, rim + 14 + rand() * 16);
  }
  const ground = (d, s, lift) => { const p = at(d, s); return [p.x, groundHeightOn(islandObj, p.x, p.z) + lift, p.z]; };
  const yaw = Math.atan2(fwd.x, fwd.z);
  const objects = [islandObj];

  // ---- composition: a few objects in a deliberate arrangement rather than a scatter ----
  // Rules: one hero object on or near the view axis; supporting pieces smaller and fewer; symmetry or a
  // clear diagonal; a small coordinated palette; nature only at the edges/behind; nothing blocks the hero.
  // Coordinates: d = distance beyond the island centre (negative = nearer the camera), s = sideways.
  const taken = [];
  const add = (type, props, d, s, r) => { const o = mkObj(type, props); objects.push(o); if (r) taken.push({ d, s, r }); return o; };
  const on = (d, s, lift) => ground(150 + d, s, lift);
  const free = (d, s, r) => taken.every(t => Math.hypot(t.d - d, t.s - s) > t.r + r + 4) && Math.hypot(d, s) < 80;
  const pick = arr => arr[(rand() * arr.length) | 0];
  const heroCol = hex(pick([C('zenith').lerp(BLACK, 0.25), C('mid'), C('rock').lerp(C('low'), 0.5)]));
  const supCol = hex(C('mid').lerp(WHITE, 0.15)), stone = hex(C('high').lerp(WHITE, 0.4)), lampCol = hex(C('sun').lerp(WHITE, 0.25));
  const heroBall = () => pick([['Chrome ball', 'metal', '#f2f2f2'], ['Glass ball', 'glass', hex(C('horizon').lerp(WHITE, 0.7))], ['Glossy ball', 'glossy', heroCol]]);
  const sphere = (name, mat, color, r, d, s, lift = r) => add('sphere', { name, mat, color, scale: [r / 5, r / 5, r / 5], pos: on(d, s, lift) }, d, s, r);
  const column = (name, d, s) => add('column', { name, mat: 'granite', color: stone, pos: on(d, s, -1), rot: [0, yaw, 0] }, d, s, 4.5);
  const onTop = (c, dy) => [c.pos[0], c.pos[1] + dy, c.pos[2]];
  const lampOn = (name, c) => add('lamp', { name, color: lampCol, pos: onTop(c, 28.4) });
  const orbOn = (c, mat, color) => add('sphere', { name: 'Orb', mat, color, scale: [0.72, 0.72, 0.72], pos: onTop(c, 29.2) });

  const LAYOUTS = {
    'Centrepiece'() {   // one hero on the axis, framed by a symmetric pair, a floating accent above
      const [n, m, c] = heroBall(), r = 8 + rand() * 3, w = 30 + rand() * 8;
      sphere(n, m, c, r, 5, 0);
      const pair = [column('Column L', 0, -w), column('Column R', 0, w)];
      if (rand() < 0.6) { lampOn('Lamp L', pair[0]); lampOn('Lamp R', pair[1]); } else pair.forEach(p => orbOn(p, 'glossy', supCol));
      add('pyramid', { name: 'Pyramid', mat: 'glossy', color: heroCol, scale: [1.6, 1.8, 1.6], pos: on(5, 0, r * 2 + 30), rot: [Math.PI, rand() * Math.PI, 0] });
    },
    'Colonnade'() {     // a receding diagonal row of columns, a light at the far end, the hero opposite
      const n = 3 + ((rand() * 3) | 0), side = rand() < 0.5 ? -1 : 1, cols = [];
      for (let i = 0; i < n; i++) { const t = i / (n - 1); cols.push(column('Column ' + (i + 1), -25 + t * 70, side * (40 - t * 55))); }
      lampOn('Lamp', cols[n - 1]);
      cols.slice(0, -1).forEach(c => orbOn(c, 'metal', '#f2f2f2'));
      const [n2, m2, c2] = heroBall(); sphere(n2, m2, c2, 7, 10, -side * 28);
      add('torus', { name: 'Ring', mat: 'glossy', color: heroCol, pos: on(20, -side * 5, 40), rot: [Math.PI / 2 + (rand() - 0.5) * 0.3, 0, 0] });
    },
    'Rule of thirds'() { // a tall stack on one third, a small counterweight group on the other, open middle
      const side = rand() < 0.5 ? -1 : 1;
      add('cube', { name: 'Plinth', mat: 'granite', color: stone, scale: [1.4, 1.2, 1.4], pos: on(10, side * 28, 4.8), rot: [0, yaw + 0.3, 0] }, 10, side * 28, 9);
      const [n, m, c] = heroBall(); add('sphere', { name: n, mat: m, color: c, scale: [1.5, 1.5, 1.5], pos: on(10, side * 28, 16.6) });
      sphere('Small ball', 'glossy', heroCol, 3.5, 30, -side * 32);
      sphere('Checker ball', 'checker', '#ffffff', 2.5, 22, -side * 22);
      add('lamp', { name: 'Floating lamp', color: lampCol, pos: on(35, -side * 28, 22) });
    },
    'Stone circle'() {  // standing stones on an arc behind a centre object, open toward the camera
      const k = 5 + ((rand() * 3) | 0), R = 42;
      for (let i = 0; i < k; i++) {
        const a = Math.PI * (0.1 + 0.8 * i / (k - 1)), d = 15 + Math.sin(a) * R * 0.8, s2 = -Math.cos(a) * R;
        add('cube', { name: 'Stone ' + (i + 1), mat: 'granite', color: stone, scale: [0.55, 2 + rand() * 0.8, 0.35], pos: on(d, s2, 7), rot: [0, yaw + Math.atan2(s2, d - 15), (rand() - 0.5) * 0.08] }, d, s2, 4);
      }
      if (rand() < 0.5) add('lamp', { name: 'Centre light', color: lampCol, pos: on(15, 0, 16) });
      else { const [n, m, c] = heroBall(); sphere(n, m, c, 6, 15, 0, 12); }
    },
    'Still life'() {    // a small touching group of primitives, like a render test
      add('cube', { name: 'Cube', mat: 'glossy', color: heroCol, scale: [1.2, 1.2, 1.2], pos: on(5, -6, 4.8), rot: [0, yaw + 0.5, 0] }, 5, -6, 7);
      const [n, m, c] = heroBall(); add('sphere', { name: n, mat: m, color: c, scale: [1, 1, 1], pos: on(5, -6, 14.3) });
      add('cone', { name: 'Cone', mat: 'metal', color: hex(C('sun')), scale: [1, 1.4, 1], pos: on(10, 9, 7) }, 10, 9, 5);
      sphere('Checker ball', 'checker', '#ffffff', 4, -6, 6);
      add('lamp', { name: 'Floating lamp', color: lampCol, pos: on(30, 18, 26) });
    },
  };
  const layout = opts.layout && (LAYOUTS[opts.layout] || opts.layout === 'Empty') ? opts.layout : pick(Object.keys(LAYOUTS));
  islandObj.role = 'base';
  if (layout !== 'Empty') LAYOUTS[layout]();

  // a little nature at the sides and behind, never in front of the arrangement, never overlapping it
  const scatter = (model, r, scl, n, dMin) => {
    for (let i = 0, tries = 0; i < n && tries < 40; tries++) {
      const a = Math.PI * (rand() * 1.2 - 0.1), rr = 50 + rand() * 30, d = Math.max(dMin, Math.sin(a) * rr), s2 = -Math.cos(a) * rr;
      if (!free(d, s2, r)) continue;
      add('model', { model, scale: [scl, scl, scl], pos: on(d, s2, -0.8), rot: [0, rand() * 6, 0] }, d, s2, r); i++;
    }
  };
  if (rand() < 0.7) scatter('tree', 14, (32 + rand() * 12) / 40, 1, 10);
  scatter(rand() < 0.5 ? 'boulder' : 'rock', 4, (3 + rand() * 4) / 5, 1 + ((rand() * 2) | 0), -20);
  // number repeated names (Orb, Orb 2, Orb 3...) so the object list can tell them apart
  const seen = {};
  for (const o of objects) { const n = (seen[o.name] = (seen[o.name] || 0) + 1); if (n > 1) o.name = `${o.name} ${n}`; }
  return {
    version: 1, name: 'untitled', seed: seedV, palette: palName, layout, terrain: { ...terr }, sky: skyS,
    camera: { pos: cpos.toArray(), target: (floating ? new V3(isl.x, islandObj.pos[1] - 5, isl.z) : baseTop !== null ? new V3(isl.x, baseTop + 10, isl.z) : cpos.clone().addScaledVector(dir, 150)).toArray(), fov: 50 }, objects,
  };
}

    return add('cylinder', { name, mat: 'glow', color, scale: [rad / 4, len / 10, rad / 4], pos: A.clone().add(B).multiplyScalar(0.5).toArray(), rot: [e.x, e.y, e.z] });
  };
  const d = { version: 1, name: 'untitled', seed: seedV, palette: S.pal, layout: S.label, scene: key,
    sky: { elev: 20, az: 0, cloudSeed: r(0, 100), fog: 0.0008, waterSeed: r(0, 100), night: false }, camera: { pos: [0, 10, 150], target: [0, 10, 0], fov: 50 }, objects };
  S.build({ d, r, side, add, ball, gy, C, hex, azTo, box, cyl, beam });

}

  terr = doc.terrain = { ...TERRAIN_DEFAULTS, ...(doc.terrain || {}) };

  terrainGeo.computeVertexNormals();

    c.copy(low).lerp(mid, smooth(4, 60, y - terr.waterY + j * 80));

  uniforms: { tex: { value: rt.texture }, res: { value: new THREE.Vector2(W, H) }, ss: { value: SS }, mode: { value: 0 }, accum: { value: false } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }`,
  fragmentShader: `

function setMode(m) {

      + (mode === 'world' ? `<label style="display:block;margin-top:6px"><input type="checkbox" data-g="keep" ${wiz.keepObjs ? 'checked' : ''}> Keep my objects (move them onto the new ground)</label>` : '');
    if (p === 'Look') body = `<div class="hint">Palette</div><div class="choices c3">${Object.keys(PALETTES).map(k => opt('pal', k, k[0].toUpperCase() + k.slice(1), wiz.pal === k, swatch(k))).join('')}</div>
      <div class="hint">Time of day</div><div class="choices c3">${Object.entries(LOOK_TIMES).map(([k, v]) => opt('time', k, v, wiz.time === k)).join('')}</div>
      <div class="hint">Weather</div><div class="choices c3">${Object.entries(LOOK_WEATHER).map(([k, v]) => opt('weather', k, v, wiz.weather === k)).join('')}</div>`;
    if (p === 'Arrangement' && SCENES[wiz.world]) body = `<div class="hint">${SCENES[wiz.world].label} has its own composition.</div><button data-a="reroll" style="margin-top:6px">🎲 Another version</button>`;
    else if (p === 'Arrangement') body = `<div class="hint">How are the objects arranged?</div><div class="choices c2">${['random', 'Centrepiece', 'Colonnade', 'Rule of thirds', 'Stone circle', 'Still life', 'Empty'].map(k => opt('layout', k, k === 'random' ? 'Any (random)' : k, wiz.layout === k)).join('')}</div>
      <button data-a="reroll" style="margin-top:6px">🎲 Another version</button>`;
    el.innerHTML = `<div class="title"><span>${mode === 'new' ? 'New Scene' : mode === 'world' ? 'Change World' : 'Change Look'}${pages.length > 1 ? ` - Step ${wiz.step + 1} of ${pages.length}: ${p}` : ''}</span><span class="tb"><b data-a="cancel">×</b></span></div>
      <div class="body">${body}</div>
      <div class="wbtns">${mode === 'new' && wiz.step === 0 ? '<button data-a="surprise">Surprise me</button>' : '<span></span>'}<span>
      ${wiz.step > 0 ? '<button data-a="back">&lt; Back</button>' : ''}${last ? '<button data-a="finish"><b>Finish</b></button>' : '<button data-a="next">Next &gt;</button>'}
      <button data-a="cancel">Cancel</button></span></div>`;
  };
  // live preview: changes rebuild the scene behind the dialog
  const preview = () => {
    if (mode === 'new') wizBuild();
    else if (mode === 'look') { applyLook(doc, wiz); applyDoc(); }
    else if (mode === 'world') changeWorld(JSON.parse(keep), wiz.world, wiz.keepObjs);
  };
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-a], [data-g]'); if (!b) return;
    if (b.dataset.g) {
      wiz[b.dataset.g] = b.dataset.v;
      if (['pal', 'time', 'weather'].includes(b.dataset.g)) wiz.lookTouched = true;
      if (b.dataset.g === 'world' && mode === 'new') { const W = SCENES[b.dataset.v] || LANDSCAPES[b.dataset.v]; wiz.pal = W.pal; wiz.lookTouched = false; if (W.time) wiz.time = W.time; }
      preview(); draw(); return;
    }
    const a = b.dataset.a;
    if (a === 'next') { wiz.step++; draw(); }
    else if (a === 'back') { wiz.step--; draw(); }
    else if (a === 'reroll') { wiz.seed = (Math.random() * 1e9) | 0; preview(); }
    else if (a === 'surprise') {
      const pick = o => { const k = Object.keys(o); return k[(Math.random() * k.length) | 0]; };
      const scene = Math.random() < 0.65;
      Object.assign(wiz, { world: pick(scene ? SCENES : LANDSCAPES), time: pick({ day: 1, day2: 1, dusk: 1, night: 1 }).replace('2', ''), weather: pick(LOOK_WEATHER), layout: 'random', seed: (Math.random() * 1e9) | 0, lookTouched: false });
      wiz.pal = (SCENES[wiz.world] || LANDSCAPES[wiz.world]).pal; preview(); close(); msg.textContent = `Surprise: ${(SCENES[wiz.world] || LANDSCAPES[wiz.world]).label}`;
    }
    else if (a === 'finish') { close(); msg.textContent = mode !== 'new' ? 'Done' : doc.scene ? `New scene: ${doc.layout}` : `New scene: ${doc.layout} layout`; }
    else if (a === 'cancel') cancel();
  });
  const cancel = () => { if (keep) { doc = JSON.parse(keep); applyDoc(); } close(); };
  el._close = cancel;
  el.addEventListener('change', e => { if (e.target.dataset.g === 'keep') { wiz.keepObjs = e.target.checked; preview(); } });
  if (mode !== 'new') preview();
  draw();
}
// Change World: swap the landscape and the base the scene stands on; optionally carry objects along
function changeWorld(base, worldKey, keepObjs) {
  const L = LANDSCAPES[worldKey];
  const terrain = { ...TERRAIN_DEFAULTS, ...L.t, stageX: base.terrain.stageX, stageZ: base.terrain.stageZ };
  if (!keepObjs) {
    const d = generateDoc(base.seed, base.palette, terrain); d.sky = base.sky; d.palette = base.palette; doc = d; applyDoc(); return;
  }
  const d = base;
  const old = d.objects.find(o => o.role === 'base') || d.objects.find(o => o.type === 'terrain' || o.type === 'floater');
  d.terrain = terrain;
  const wy = terrain.waterY || 0, floating = terrain.land === false, wet = terrain.water && terrain.stageFloor < 0 && terrain.stage > 0;
  const cx = old ? old.pos[0] : terrain.stageX, cz = old ? old.pos[2] : terrain.stageZ;
  const nb = floating
    ? mkObj('floater', { name: 'Floating isle', mat: 'land', color: '#cccccc', pos: [cx, wy + 80, cz], terrain: { ...FLOAT_DEFAULTS, tseed: (old && old.terrain && old.terrain.tseed) || 1 } })
    : mkObj('terrain', { name: wet ? 'Island' : 'Knoll', mat: 'land', color: '#cccccc', pos: [cx, wy, cz], terrain: { ...TOBJ_DEFAULTS, tseed: (old && old.terrain && old.terrain.tseed) || 1 } });
  nb.role = 'base'; nb.id = old ? old.id : nb.id;
  // anything standing on the old base moves with it: same offset above the new surface at the same x/z
  if (old) for (const o of d.objects) {
    if (o === old || o.type === 'clouds') continue;
    if (Math.hypot(o.pos[0] - cx, o.pos[2] - cz) > 110) continue;
    const off = o.pos[1] - groundHeightOn(old, o.pos[0], o.pos[2]);
    if (off > 80) continue;   // high flyers stay where they are
    o.pos[1] = groundHeightOn(nb, o.pos[0], o.pos[2]) + off;
  }
  const dy = nb.pos[1] - (old ? old.pos[1] : 0);
  d.camera.pos[1] += dy; d.camera.target[1] += dy;
  d.objects = old ? d.objects.map(o => o === old ? nb : o) : [nb, ...d.objects];
  doc = d; applyDoc();
}

// ---------- files ----------
const randomKey = o => { const k = Object.keys(o); return k[(Math.random() * k.length) | 0]; };
function newRandom() {
  const sd = (Math.random() * 1e9) | 0;
  if (Math.random() < 0.65) {
    const k = randomKey(SCENES);
    doc = generateScene(k, sd); applyDoc(); msg.textContent = `New random scene: ${SCENES[k].label}${undoHint()}`; commit(); return;
  }
  const k = randomKey(LANDSCAPES), L = LANDSCAPES[k];
  doc = generateDoc(sd, L.pal, { ...TERRAIN_DEFAULTS, ...L.t }, { base: L.base }); applyDoc();
  msg.textContent = `New random scene: ${L.label}, ${doc.layout} layout${undoHint()}`; commit();
}
function newSameLandscape() {
  const sd = (Math.random() * 1e9) | 0;
  if (doc.scene && SCENES[doc.scene]) { doc = generateScene(doc.scene, sd); applyDoc(); msg.textContent = `New version: ${SCENES[doc.scene].label}${undoHint()}`; commit(); return; }
  doc = generateDoc(sd, doc.palette, doc.terrain); applyDoc(); msg.textContent = `New scene, same landscape: ${doc.layout} layout${undoHint()}`; commit();
}
function newEmpty() {
  const d = generateDoc((Math.random() * 1e9) | 0, doc ? doc.palette : 'desert', doc && doc.terrain);
  d.objects = []; doc = d; applyDoc(); msg.textContent = `Empty scene - add objects from the Create panel${undoHint()}`; commit();
}
function newLandscapePattern() {
  doc.seed = (Math.random() * 1e9) | 0; applyEnvironment(); updateReflections(); if (sel === 'terrain') renderTerrainPanel();
  msg.textContent = `New landscape pattern${undoHint()}`; commit();
}
const cleanName = n => n.replace(/\.tsc\.json$|\.json$|\.tsc$/i, '').replace(/[\\/:*?"<>|]+/g, '').trim();
function saveDoc() {
  commit();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(doc, null, 1)], { type: 'application/json' }));
  a.download = (doc.name || 'untitled') + '.tsc'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  savedKey = histKey; updateTitle();
  msg.textContent = `Saved ${a.download}`;
}
function saveAs() {
  dialog('Save As', `Scene name:<input type="text" value="${(doc.name || 'untitled').replace(/"/g, '&quot;')}">`, [
    ['Save', d => { const n = cleanName(d.querySelector('input').value); if (!n) return false; doc.name = n; saveDoc(); }], ['Cancel']]);
}
function openDocUI() {
  if (histKey === savedKey) { $('openFile').click(); return; }
  dialog('Open', `<b>${doc.name || 'untitled'}</b> has unsaved changes. Opening another scene replaces it.`, [
    ['Save first', () => { saveDoc(); $('openFile').click(); }], ['Open anyway', () => $('openFile').click()], ['Cancel']]);
}
$('openFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.objects) || !d.camera || !d.sky) throw new Error('not a Terrascape scene');
    d.name = cleanName(f.name);
    msg.textContent = `Loading models for ${f.name}…`;
    await loadDocModels(d);
    doc = d; applyDoc(); resetHistory(); msg.textContent = `Opened ${f.name}`;
  } catch (err) { dialog('Open', `Couldn't open that file: ${err.message}`); }
});

// ---------- undo / redo: whole-document snapshots ----------
// The camera and file name are left out, so orbiting isn't an edit and undo never jumps the view.
// Any pointer-up, change or key-up schedules a commit; it only records a step if the scene really changed.
const MOD = /Mac|iPhone|iPad/.test(navigator.platform) ? '⌘' : 'Ctrl+';
const undoHint = () => ` - ${MOD}Z to undo`;
const undoStack = [], redoStack = [];
let histKey = null, savedKey = null, commitT = 0;
const docKey = d => JSON.stringify({ ...d, camera: undefined, name: undefined });
function updateTitle() {
  if (!doc) return;
  $('docname').textContent = (doc.name || 'untitled') + '.tsc' + (histKey && histKey !== savedKey ? ' *' : '');
}
function resetHistory() { undoStack.length = 0; redoStack.length = 0; histKey = savedKey = docKey(doc); updateTitle(); }
function commit() {
  clearTimeout(commitT);
  if (!doc || wiz || histKey === null) return;
  const k = docKey(doc);
  if (k === histKey) return;
  undoStack.push(histKey); if (undoStack.length > 80) undoStack.shift();
  redoStack.length = 0; histKey = k; updateTitle();
}
function commitSoon() { clearTimeout(commitT); commitT = setTimeout(commit, 200); }
['pointerup', 'change', 'keyup'].forEach(t => addEventListener(t, commitSoon, true));
function restore(k) {
  const keepSel = isObj() ? sel.id : sel;
  const d = JSON.parse(k); d.camera = doc.camera; d.name = doc.name;
  doc = d; histKey = k; applyDoc();
  if (keepSel === 'terrain') select('terrain');
  else if (keepSel != null) { const o = doc.objects.find(x => x.id === keepSel); if (o) select(o); }
}
function undo() {
  if (wiz) return; commit();
  if (!undoStack.length) { msg.textContent = 'Nothing to undo'; return; }
  redoStack.push(histKey); restore(undoStack.pop()); msg.textContent = `Undone (${undoStack.length} more)`;
}
function redo() {
  if (wiz) return; commit();
  if (!redoStack.length) { msg.textContent = 'Nothing to redo'; return; }
  undoStack.push(histKey); restore(redoStack.pop()); msg.textContent = 'Redone';
}
addEventListener('beforeunload', e => { if (histKey && histKey !== savedKey) e.preventDefault(); });

// ---------- Sky & Fog quick controls ----------
function skyChange(fn) { fn(doc.sky); applyEnvironment(); updateReflections(); if (sel === 'terrain') renderTerrainPanel(); if (mode !== 'edit') renderFinal(mode === 'ray'); }
const swatch = p => { const P = PALETTES[p] || {}; return `<div class="sw">${['zenith', 'horizon', 'high', 'mid', 'low', 'water'].map(k => `<i style="background:${P[k]}"></i>`).join('')}</div>`; };

// ---------- dialogs ----------
// buttons: [label, fn]; the first is the default (Enter). fn returning false keeps the dialog open. Esc cancels.
function dialog(title, html, buttons = [['OK']]) {
  closeMenu();
  const shade = document.createElement('div'); shade.className = 'shade';
  const d = document.createElement('div'); d.className = 'dialog';
  d.innerHTML = `<div class="title"><span>${title}</span><span class="tb"><b>×</b></span></div><div class="body">${html}</div>
    <div class="ok">${buttons.map(([l], i) => `<button data-i="${i}">${i === 0 ? `<b>${l}</b>` : l}</button>`).join('')}</div>`;
  $('win').append(shade, d);
  const close = () => { d.remove(); shade.remove(); };
  d._close = close;
  d.querySelector('.tb b').onclick = close;
  d.querySelector('.ok').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const fn = buttons[+b.dataset.i][1];
    if (fn && fn(d) === false) return;
    close();
  });
  d.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.tagName !== 'BUTTON') { e.preventDefault(); d.querySelector('.ok button').click(); }
    if (e.key === 'Escape') close();
    e.stopPropagation();
  });
  const inp = d.querySelector('input');
  if (inp) { inp.focus(); inp.select(); } else d.querySelector('.ok button').focus();
  return d;
}
const topDialog = () => [...$('win').querySelectorAll('.dialog')].pop();
const HELP = `<table>
  <tr><td>Drag</td><td>orbit the camera</td></tr><tr><td>Right-drag</td><td>pan</td></tr><tr><td>Wheel</td><td>zoom</td></tr>
  <tr><td>Click</td><td>select an object (click the far landscape for land &amp; sky)</td></tr><tr><td>W / E / R</td><td>move / rotate / scale</td></tr>
  <tr><td>F</td><td>frame the selection</td></tr><tr><td>${MOD}D</td><td>duplicate</td></tr><tr><td>Delete</td><td>delete</td></tr>
  <tr><td>${MOD}Z / ${MOD}⇧Z</td><td>undo / redo</td></tr>
  <tr><td>Enter</td><td>render</td></tr><tr><td>Shift+Enter</td><td>ray trace</td></tr><tr><td>${MOD}E</td><td>save image</td></tr>
  <tr><td>Esc</td><td>close dialog / back to edit / deselect</td></tr>
  <tr><td>${MOD}S / ${MOD}⇧S</td><td>save / save as</td></tr><tr><td>${MOD}O</td><td>open scene</td></tr></table>`;

// ---------- menus ----------
const sep = '-';
function menuSpec() {
  const recent = recentModels.filter(k => MODELS[k]);
  return {
    File: [
      ['New Scene…', () => openWizard()], ['New Random Scene', newRandom], ['New Scene, Same Landscape', newSameLandscape], ['New Empty Scene', newEmpty], sep,
      ['Open…', openDocUI, MOD + 'O'], ['Save', saveDoc, MOD + 'S'], ['Save As…', saveAs, MOD + '⇧S'], sep,
      ['Save Image…', saveImage, MOD + 'E'],
    ],
    Edit: [
      ['Undo', undo, MOD + 'Z', !undoStack.length], ['Redo', redo, MOD + '⇧Z', !redoStack.length], sep,
      ['Duplicate', duplicate, MOD + 'D', !isObj()], ['Delete', deleteSel, 'Del', !isObj()], sep,
      ['Move', () => setGizmo('translate'), 'W', !isObj(), isObj() && gizmo.mode === 'translate'], ['Rotate', () => setGizmo('rotate'), 'E', !isObj(), isObj() && gizmo.mode === 'rotate'],
      ['Scale', () => setGizmo('scale'), 'R', !isObj(), isObj() && gizmo.mode === 'scale'], sep,
      ['Drop to Ground', dropToGround, '', !isObj()], ['Deselect', () => select(null), 'Esc', !sel],
    ],
    Objects: [
      ...Object.entries(TYPES).map(([k, v]) => [v, () => create(k)]), sep,
      ['Browse Poly Haven…', () => openBrowser()],
      ...(recent.length ? [sep, { head: 'Recent models' }, ...recent.map(k => [MODELS[k].label, () => create('model', { model: k })])] : []),
    ],
    Landscape: [
      ['Landscape Settings…', () => { if (mode !== 'edit') setMode('edit'); landTab = 'Shape'; select('terrain'); }],
      ['Water Settings…', () => { if (mode !== 'edit') setMode('edit'); landTab = 'Water'; select('terrain'); }], sep,
      ['Change World…', () => openWizard(0, 'world')], ['New Landscape Pattern', newLandscapePattern],
    ],
    'Sky & Fog': [
      ['Change Look…', () => openWizard(0, 'look'), 'palette, time, weather'],
      ['Sky Settings…', () => { if (mode !== 'edit') setMode('edit'); landTab = 'Sky'; select('terrain'); }],
      ['Randomize Sky', () => skyChange(s => { s.elev = 8 + Math.random() * 30; s.az = (Math.random() - 0.5) * 92; s.cloudSeed = Math.random() * 100; })], sep,
      ['Night (moon & stars)', () => skyChange(s => s.night = !s.night), '', false, !!doc.sky.night],
      ['Add Cloud Layer', () => create('clouds')], sep,
      ['Sun Higher', () => skyChange(s => s.elev = Math.min(85, s.elev + 5))], ['Sun Lower', () => skyChange(s => s.elev = Math.max(1, s.elev - 5))],
      ['Sun Left', () => skyChange(s => s.az -= 15)], ['Sun Right', () => skyChange(s => s.az += 15)], sep,
      ['Thicker Fog', () => skyChange(s => s.fog *= 1.3)], ['Thinner Fog', () => skyChange(s => s.fog /= 1.3)],
    ],
    View: [
      ['Solid', () => { viewMode = 'solid'; setMode('edit'); }, '', false, viewMode === 'solid'],
      ['Wireframe', () => { viewMode = 'wire'; setMode('edit'); }, '', false, viewMode === 'wire'], sep,
      ['Frame Selection', frameSel, 'F', !isObj()],
    ],
    Render: [
      ['Render', () => renderFinal(false), 'Enter'], ['Ray Trace', () => renderFinal(true), '⇧Enter'], ['Back to Edit', () => setMode('edit'), 'Esc', mode === 'edit'], sep,
      ['Save Image…', saveImage, MOD + 'E'], sep,
      ['256 Colors', () => setColors(2), '', false, colorMode === 2], ['Thousands of Colors', () => setColors(1), '', false, colorMode === 1],
      ['Millions of Colors', () => setColors(0), '', false, colorMode === 0], sep, { head: 'Output size' },
      ...[['400', '400 x 300'], ['640', '640 x 480'], ['800', '800 x 600'], ['full', 'Full Resolution']].map(([k, l]) => [l, () => setResolution(k), '', false, resKey === k]),
    ],
    Help: [['Controls', () => dialog('Controls', HELP)], ['About Terrascape', () => dialog('About Terrascape',
      `<b>Terrascape 2.0</b><br>A 90s-style landscape renderer built on three.js.<br>Raster preview, supersampled render, and a Whitted ray tracer.<br>Models from Poly Haven (CC0).`)]],
  };
}
const bar = $('menubar');
let openMenu = null, dropEl = null, hoverOpened = null;
function closeMenu() { if (dropEl) dropEl.remove(); dropEl = null; if (openMenu) openMenu.classList.remove('open'); openMenu = null; hoverOpened = null; }
function showMenu(el) {
  closeMenu();
  if (!doc) return;
  openMenu = el; el.classList.add('open');
  const items = menuSpec()[el.dataset.m];
  dropEl = document.createElement('div'); dropEl.className = 'dropdown';
  dropEl.style.left = el.offsetLeft + 'px'; dropEl.style.top = (el.offsetTop + el.offsetHeight) + 'px';
  for (const it of items) {
    if (it === sep) { dropEl.insertAdjacentHTML('beforeend', '<div class="sep"></div>'); continue; }
    if (it.head) { dropEl.insertAdjacentHTML('beforeend', `<div class="item head">${it.head}</div>`); continue; }
    const [label, fn, key = '', disabled = false, checked = false] = it;
    const d = document.createElement('div');
    d.className = 'item' + (checked ? ' checked' : '') + (disabled ? ' off' : '');
    d.innerHTML = `<span>${label}</span><span class="k">${key}</span>`;
    d.onclick = e => { e.stopPropagation(); if (disabled) return; closeMenu(); fn(); commitSoon(); };
    dropEl.appendChild(d);
  }
  bar.appendChild(dropEl);
}
bar.innerHTML = ['File', 'Edit', 'Objects', 'Landscape', 'Sky & Fog', 'View', 'Render', 'Help'].map(m => `<div data-m="${m}">${m}</div>`).join('');
bar.querySelectorAll('[data-m]').forEach(el => {
  // a click opens its menu; it only closes one that was already open before the pointer arrived
  el.addEventListener('click', e => {
    e.stopPropagation();
    if (openMenu === el && hoverOpened !== el) closeMenu();
    else { if (openMenu !== el) showMenu(el); hoverOpened = null; }
  });
  el.addEventListener('mouseenter', () => { if (openMenu && openMenu !== el) { showMenu(el); hoverOpened = el; } });
});
document.addEventListener('click', closeMenu);

// ---------- buttons and keys ----------
$('btnRender').onclick = () => renderFinal(false);
$('btnRay').onclick = () => renderFinal(true);
$('btnEdit').onclick = () => setMode('edit');
$('btnSaveImg').onclick = saveImage;
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(), mod = e.metaKey || e.ctrlKey;
  if (k === 'escape') {
    if (dropEl) { closeMenu(); return; }
    const top = topDialog(); if (top) { top._close(); return; }
  }
  if (e.target.matches('input, select, textarea')) return;
  if (topDialog() || wiz) return;   // shortcuts wait until dialogs are closed
  if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === 'y') { e.preventDefault(); redo(); return; }
  if (mod && k === 's') { e.preventDefault(); e.shiftKey ? saveAs() : saveDoc(); return; }
  if (mod && k === 'o') { e.preventDefault(); openDocUI(); return; }
  if (mod && k === 'e') { e.preventDefault(); saveImage(); return; }
  if (mod && k === 'd') { e.preventDefault(); duplicate(); return; }
  if (k === 'escape') { if (mode !== 'edit') setMode('edit'); else select(null); return; }
  if (k === 'enter') { if (e.target.closest('button, a')) return; e.preventDefault(); renderFinal(e.shiftKey); return; }
  if (mode !== 'edit' || mod) return;
  if (k === 'w') setGizmo('translate'); else if (k === 'e') setGizmo('rotate'); else if (k === 'r') setGizmo('scale');
  else if (k === 'f') frameSel(); else if (k === 'delete' || k === 'backspace') { e.preventDefault(); deleteSel(); }
});

// ---------- start up ----------
startPixelEmoji(document.body);   // 16-colour pixel icons instead of glossy system emoji
setResolution('400');
renderInspector();
msg.textContent = 'Loading Poly Haven models...';
assetsReady.then(() => {
  doc = generateDoc(1234, 'desert');
  applyDoc();
  $('win').classList.remove('loading');
  frame();
  openWizard(0, 'new', true);   // start by choosing a world
  // build picking structures for the big models in the background so the first click is quick
  setTimeout(() => Object.values(models).forEach(ensureBVH), 500);
});
</script>
</body>
</html>
